<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch with Hello World." />
    <title>Contact us</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <div class="site-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="brand" href="index.html">Hello World</a>
        <div class="nav-links">
          <a href="about.html">About</a>
          <a href="contact.html" aria-current="page">Contact</a>
        </div>
      </nav>
      <main class="panel page-panel">
        <header class="page-heading">
          <p class="eyebrow"><span class="dot"></span> Say hello</p>
          <h1>Let's make something <span>great.</span></h1>
          <p class="lead">Have a question, a bright idea, or simply want to say hello? We would love to hear from you.</p>
        </header>
        <div class="contact-grid">
          <section class="contact-options" aria-label="Other ways to connect">
            <a class="contact-option" href="mailto:hello@example.com">
              <span>Email us</span>
              <strong>hello@example.com</strong>
            </a>
            <a class="contact-option" href="about.html">
              <span>Our story</span>
              <strong>Get to know us →</strong>
            </a>
          </section>
          <form id="contactForm">
            <label>
              Your name
              <input type="text" name="name" autocomplete="name" required />
            </label>
            <label>
              Email address
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label>
              Your message
              <textarea name="message" required></textarea>
            </label>
            <button type="submit">Send message</button>
            <p id="formStatus" class="form-status" aria-live="polite"></p>
          </form>
        </div>
      </main>
    </div>
    <script>
      const form = document.querySelector("#contactForm");
      const formStatus = document.querySelector("#formStatus");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        formStatus.textContent = "Thanks for reaching out! We'll be in touch soon. ✨";
        form.reset();
      });
    </script>
  </body>
</html>
