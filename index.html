<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A stylish Hello World welcome page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fafc;
        --muted: #bac5dd;
        --glass: rgba(12, 19, 42, 0.58);
        --line: rgba(255, 255, 255, 0.14);
        --violet: #9d7bff;
        --cyan: #54e5ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        background: #070b1a;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(4px);
        opacity: 0.8;
        pointer-events: none;
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb--one {
        width: min(45vw, 520px);
        aspect-ratio: 1;
        top: -13%;
        left: -9%;
        background: radial-gradient(circle at 35% 35%, #a678ff, #5633bb 55%, transparent 70%);
      }

      .orb--two {
        width: min(42vw, 460px);
        aspect-ratio: 1;
        right: -8%;
        bottom: -14%;
        background: radial-gradient(circle at 45% 45%, #42d8ff, #1265be 53%, transparent 70%);
        animation-delay: -5s;
      }

      main {
        position: relative;
        width: min(100%, 760px);
        padding: clamp(2.5rem, 8vw, 5.5rem);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(27, 35, 72, 0.76), var(--glass));
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.11);
        backdrop-filter: blur(20px);
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.5rem;
        color: var(--cyan);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7df6b5;
        box-shadow: 0 0 14px #7df6b5;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.3rem, 11vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.075em;
      }

      h1 span {
        background: linear-gradient(105deg, #fff 18%, #b7a5ff 50%, #63edff 85%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 38rem;
        margin: 1.55rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.4vw, 1.18rem);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem;
        margin-top: 2.25rem;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.25rem;
        color: #07101f;
        background: linear-gradient(105deg, var(--cyan), #b6a0ff);
        box-shadow: 0 8px 24px rgba(84, 229, 255, 0.25);
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      button:hover { transform: translateY(-3px); box-shadow: 0 13px 30px rgba(84, 229, 255, 0.38); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      #message {
        min-height: 1.5em;
        margin-top: 1.4rem;
        color: #d7ceff;
        font-size: 0.95rem;
      }

      @keyframes drift {
        to { transform: translate(7vw, 5vh) scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb { animation: none; }
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <main>
      <div class="eyebrow"><span class="dot"></span> A fresh beginning</div>
      <h1>Hello, <span>World!</span></h1>
      <p>One small page, a whole universe of possibilities. Your next great idea can start right here.</p>
      <div class="actions">
        <button type="button" id="helloButton">Say hello back</button>
      </div>
      <div id="message" aria-live="polite"></div>
    </main>
    <script>
      const helloButton = document.querySelector("#helloButton");
      const message = document.querySelector("#message");
      helloButton.addEventListener("click", () => {
        message.textContent = "Hello back! Let's make something wonderful. ✨";
      });
    </script>
  </body>
</html>
