<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A stylish Hello World welcome page." />
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <div class="site-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-current="page">Hello World</a>
        <div class="nav-links">
          <a href="about.html">About</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>
      <main class="panel hero-panel">
        <div>
          <div class="eyebrow"><span class="dot"></span> A fresh beginning</div>
          <h1>Hello, <span>World!</span></h1>
          <p class="lead">One small page, a whole universe of possibilities. Your next great idea can start right here.</p>
          <div class="actions">
            <button type="button" id="helloButton">Say hello back</button>
            <a class="button button--quiet" href="about.html">Meet the idea</a>
          </div>
          <div id="message" class="form-status" aria-live="polite"></div>
        </div>
      </main>
    </div>
    <script>
      const helloButton = document.querySelector("#helloButton");
      const message = document.querySelector("#message");
      helloButton.addEventListener("click", () => {
        message.textContent = "Hello back! Let's make something wonderful. ✨";
      });
    </script>
  </body>
</html>
